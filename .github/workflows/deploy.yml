name: Deploy to VPS

# Runs on every push to main (i.e. every "publish"), and can be triggered
# manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -se' <<'REMOTE'
            set -euo pipefail
            export PATH="$PATH:/usr/bin:/usr/local/bin"
            cd /var/www/udaan24
            git fetch --all
            git reset --hard origin/main
            npm ci
            npm run build
            npx --yes tsx db/migrate-media-columns.ts
            pm2 restart udaan24 || pm2 start npm --name udaan24 -- start
            pm2 save
            echo "✅ Deployed $(git rev-parse --short HEAD)"
          REMOTE
